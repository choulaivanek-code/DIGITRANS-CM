name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test tous les services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build complet Maven
        run: mvn clean compile -DskipTests

      - name: Tests unitaires
        run: mvn test

      - name: Package tous les services
        run: mvn clean package -DskipTests

      - name: Upload artifacts auth-service
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/*.jar

      - name: Upload artifacts api-gateway
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/*.jar

      - name: Upload artifacts erp-service
        uses: actions/upload-artifact@v4
        with:
          name: erp-service-jar
          path: erp-service/target/*.jar

      - name: Upload artifacts crm-service
        uses: actions/upload-artifact@v4
        with:
          name: crm-service-jar
          path: crm-service/target/*.jar

      - name: Upload artifacts supply-chain-service
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-jar
          path: supply-chain-service/target/*.jar

      - name: Upload artifacts bi-service
        uses: actions/upload-artifact@v4
        with:
          name: bi-service-jar
          path: bi-service/target/*.jar

  docker-build:
    name: Build Images Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package Maven
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/digitrans-auth:latest

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/digitrans-gateway:latest

      - name: Build & Push erp-service
        uses: docker/build-push-action@v5
        with:
          context: ./erp-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/digitrans-erp:latest

      - name: Build & Push crm-service
        uses: docker/build-push-action@v5
        with:
          context: ./crm-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/digitrans-crm:latest

      - name: Build & Push supply-chain-service
        uses: docker/build-push-action@v5
        with:
          context: ./supply-chain-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/digitrans-scm:latest

      - name: Build & Push bi-service
        uses: docker/build-push-action@v5
        with:
          context: ./bi-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/digitrans-bi:latest