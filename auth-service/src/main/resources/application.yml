server:
  port: 8085

spring:
  application:
    name: auth-service

jwt:
  secret: ${JWT_SECRET:digitrans-cm-secret-key-2026-very-long-and-secure-agrocam-cm}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
